<!DOCTYPE html>
<html>
<head>
    <title>Digital Credentials API Test</title>
</head>
<body>
    <h1>Digital Credentials API Browser Test</h1>
    
    <div id="status">Checking browser support...</div>
    
    <button onclick="testAPI()">Test Digital Credentials API</button>
    
    <pre id="output"></pre>
    
    <script>
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        
        // Check if API exists
        if (window.DigitalCredential) {
            status.innerHTML = '✅ DigitalCredential API is available';
            output.innerHTML += 'window.DigitalCredential: ' + window.DigitalCredential + '\n';
        } else if (navigator.credentials) {
            status.innerHTML = '⚠️ Only navigator.credentials available (not DigitalCredential)';
            output.innerHTML += 'navigator.credentials: ' + navigator.credentials + '\n';
        } else {
            status.innerHTML = '❌ No Digital Credentials support';
        }
        
        // Check Chrome version
        const match = navigator.userAgent.match(/Chrome\/(\d+)/);
        if (match) {
            const version = parseInt(match[1]);
            output.innerHTML += 'Chrome version: ' + version + '\n';
            if (version < 128) {
                output.innerHTML += '⚠️ Chrome 128+ required for Digital Credentials\n';
            }
        }
        
        // Check if running in secure context
        output.innerHTML += 'Secure context: ' + window.isSecureContext + '\n';
        output.innerHTML += 'Protocol: ' + window.location.protocol + '\n';
        
        async function testAPI() {
            try {
                output.innerHTML += '\n--- Testing Digital Credentials API ---\n';
                
                const credential = await navigator.credentials.get({
                    digital: {
                        providers: [{
                            protocol: "openid4vp",
                            request: JSON.stringify({
                                response_type: "vp_token",
                                response_mode: "dc_api", 
                                nonce: "test-nonce",
                                presentation_definition: {
                                    id: "test",
                                    input_descriptors: [{
                                        id: "test-descriptor",
                                        format: {
                                            jwt_vc_json: {}
                                        },
                                        constraints: {
                                            fields: [{
                                                path: ["$.type"],
                                                filter: {
                                                    type: "string",
                                                    const: "VerifiedPhoneNumber"
                                                }
                                            }]
                                        }
                                    }]
                                }
                            })
                        }]
                    }
                });
                
                output.innerHTML += '✅ Success! Credential: ' + JSON.stringify(credential, null, 2);
            } catch (error) {
                output.innerHTML += '❌ Error: ' + error.name + ': ' + error.message + '\n';
                output.innerHTML += 'Stack: ' + error.stack;
            }
        }
    </script>
</body>
</html>
